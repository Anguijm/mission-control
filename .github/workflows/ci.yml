name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/mission-control/package-lock.json

      - name: Install dependencies
        working-directory: ./projects/mission-control
        run: npm ci

      - name: Run Tests
        working-directory: ./projects/mission-control
        run: npm test

      - name: Build
        working-directory: ./projects/mission-control
        run: npm run build
